# PC 微信 AI 聊天辅助工具 —— 配置文件
#
# 说明：微信的控件类名和 AutomationId 都是**版本相关**的，
#       微信升级后如果读取失败，只需要改这个文件，不用动代码。
#       当前值实测于微信 4.1.13.65（Qt 5.15.14）。

wechat:
  proc_name: Weixin.exe            # 主进程名（注意 4.0 起是 Weixin 不是 WeChat）
  window_class_contains: QWindowIcon  # 主窗口类名 Qt51514QWindowIcon 的特征片段
  window_title: "微信"             # ⚠️ 用来从**多个同类窗口**里认出主窗口，见下

  # ⚠️ 上面这条 window_title 不是可有可无的：微信同时会开好几个同类窗口
  #    （主窗口 / 「图片和视频」预览 / 朋友圈 / 设置），同名同进程同类名，
  #    而 EnumWindows 的返回顺序**不保证** —— 实测同一台机器跑两次顺序就变了。
  #    挑中预览窗时**什么都读不到**，和「微信改版了 / UIA 坏了」完全分不开。
  #    排除法都试过、都不成立：「取面积最大的」也不行（预览窗 711480 px²
  #    > 主窗 544887 px²）。唯一可靠的纯 Win32 判据就是标题。

  # 通过 AutomationId 定位的节点
  node:
    chat_title: current_chat_name_label   # 当前聊天标题
    message_list: chat_message_list       # 消息列表容器
    session_list: session_list            # 会话列表容器
    input_field: chat_input_field         # 输入框

  # 通过 ClassName 定位的控件
  cls:
    session_cell: "mmui::ChatSessionCell"          # 会话列表项
    msg_text: "mmui::ChatTextItemView"             # 文本消息项
    msg_bubble_ref: "mmui::ChatBubbleReferItemView" # 图片/表情/引用消息项
    titlebar_group: "mmui::ChatTitleBarChatRoomView"    # 群聊标题栏
    titlebar_single: "mmui::ChatTitleBarChatSingleView" # 单聊标题栏
    text_view: "mmui::XTextView"                        # 通用文本控件（聊天标题在它下面）
    # 时间分隔符（Name 形如 "16:19" / "昨天 23:28"）。
    # ⚠️ 它和「拍一拍」这类系统提示**共用这一个类名**，所以代码里还会再用
    #    「Name 长得像不像时间」筛一道（reader.is_time_text），不能只看类名。
    # ⚠️ 它**没有 automationId**，所以收消息那条条件（aid 前缀）永远抓不到它。
    time_item: "mmui::ChatItemView"

# ── 读取后端 ───────────────────────────────────────────────────────────
#
# 这个工具**两条读取链路并存**：UIA（拿得到控件树时最精确、最快）和
# 「截屏 + OCR」（完全不依赖控件树）。实测**大部分环境拿不到控件树，
# 只有部分账号 / 机器能拿到** —— 微信暴不暴露控件树是**「机器 × 账号」的交互**，
# 四个组合全测过：
#     他的机器 + 他的号   ❌ 只有 2 个后代控件
#     他的机器 + 我的号   ✅ 160 个
#   我的机器 + 他的号   ✅ ／ 我的机器 + 我的号 ✅
# 既不是机器的问题、也不是账号的问题；根因在客户端改不动。
# 所以 `auto` 的语义是**自动选路**（哪条能用用哪条），**不是"出错才降级"**。
reader:
  backend: auto        # auto = 自动选路（能拿到控件树走 UIA，拿不到整屏走 OCR）；
                       # uia = 只用 UIA；ocr = 只用 OCR
  fail_switches: 3     # 连续几次「控件树几乎是空的」才选 OCR（选中后**不再来回切**）
  min_controls: 20     # 后代控件少于这个数就认为「控件树是空的」（实测正常 160、拿不到 2）

# ── OCR 读屏（backend=ocr 时生效）─────────────────────────────────────
#
# ⚠️ 这条路只从**像素**认内容，所以下面这些是**实测出来的几何标尺**，
#    不是可以随便调的样式选项。换分辨率 / 改微信字体之后要重新标定：
#        python probes/probe_ocr_read.py --calibrate
ocr_read:
  # 聊天区在窗口里的位置（**逻辑像素**，代码会乘 DPI 缩放）。
  # 实测（1542x979 物理 / 1.5 倍 → 聊天区左边界在 x≈465 物理 = 310 逻辑）：
  chat_left: 310       # ⚠️ 这只是**兜底值**，见下面 auto_geometry 那段（宽度不是常数）
  chat_top: 70         # 顶部标题栏高度
  right_margin: 0      # 右侧留白（滚动条）
  input_fallback: 150  # 检测不出输入区分隔线时，按这个高度从底部扣

  # ⚠️⚠️ **左边再往左让一点**（逻辑像素）。不让的话**第一个字会缺一笔**。
  #
  # 实测（2026-10-11，用户报「公众号被识别成众号，缺少一个字」）：
  # `probes/probe_title_clip.py` 在真机上把同一个标题栏用几种左边距各裁一次、
  # 各跑一次 OCR：
  #
  #     左边距  0（原来的）-> '众号'      ← 掉了「公」
  #     左边距  3           -> '公众号'    ✅
  #     左边距  6           -> '公众号'    ✅
  #
  # 原因是 `detect_chat_left()` 找的是「第一段足够长的纯底色列」，它的起点
  # 会比真实边界**晚几个像素**（实测真值 465、检测 467），而那几个像素正是
  # 第一个字最左边那一竖 —— 少了它 OCR 就把整个字丢掉（不是读错，是没这个字）。
  #
  # ⚠️ 别调太大：往左让到 **24 物理** 都还能正确读标题，而且「最左 30px 里
  #    有没有会话列表的文字」在 0/6/16 三种左边距下都是空的（让出去的是底色）。
  #    但再往左就会吃到会话列表的字，而标题取的是「最靠左的那一块」——
  #    一旦吃到，它会**赢过真标题**。
  left_margin: 6

  # 配置里的 chat_left 认不出气泡时，**自动从像素里找一次左边界**再试。
  # ⚠️ **检测在前、配置兜底**（2026-09-27 第四十六轮把顺序反过来了）：
  #    实测会话列表的宽度**不是常数** —— 窗口 1542 物理宽时分界在 465，
  #    1402 / 1206 宽时是 430。而自动检测在三张真截图上是 467/467/467
  #    （真值 465）。所以要信检测，上面那个 310 只是**兜底值**。
  #    检测认不出来（两边同色 / 整幅同色 / 观察不到跳变）就返回 None，退回配置值；
  #    而且认出来的值**还得真能认出气泡**才算数，所以它猜错也没有代价。
  # 出问题时想让它**严格按配置来**（别让自动纠偏掩盖问题）：改成 false。
  auto_geometry: true

  min_score: 0.5       # OCR 置信度门槛
  max_blocks: 400      # 单屏最多取多少块（防止极端情况把后面拖死）
  nickname_max_chars: 12   # 群昵称最长多少字（超过就当它是正文，不是名字）

  # ---- 「便宜探针」：让 OCR 拍得密，而空闲时不花钱（默认开）----
  #
  # 一次完整读屏 ≈ 380ms，**绝大部分是 OCR 认字**；而"这一屏变了没"根本
  # 不需要认字。实测（probes/bench_tick_cost.py，三个数都是独立量的）：
  #
  #     探针（抓图 + 缩略图哈希）  34 ms
  #     真读一屏（抓图 + OCR）    381 ms
  #     标题那一次 OCR            65 ms   ← ⚠️ 只有不走探针时才每拍做
  #
  # 所以每拍只探一次：**变了才付那 380ms**。于是
  #   · 你翻过的屏、来的新消息 —— 一条都不漏
  #   · 空闲时只占 ~3.4% 一个核
  #     （对照：UIA 那条路一整拍就 100ms，1s 一拍 = 10%）
  #
  # ⚠️ 探针模式下**每拍不再读标题**（那一项 65ms，比探针还贵）。因为探针的
  #    覆盖范围含标题栏：切会话 -> 像素变了 -> 命中 -> 那次真读会自己填标题。
  #    只有第一拍读一次，用来把界面左上角的会话名种上。
  #    ⚠️ 曾经漏了这条 —— 于是日志报 3.4% 而真实空闲成本是 9.9%（≈ UIA），
  #       我还据此说过"比 UIA 还省"。
  # ⚠️ 探针只覆盖「标题栏 + 聊天区」，**不含会话列表和输入框**：
  #    前者避免别的会话来消息误触发，后者避免你自己打字就触发一次 OCR。
  probe: true
  probe_interval: 1.0  # 安静时多久探一次（觉得不够灵敏就调小，成本线性上升）
  probe_fast: 0.5      # 内容在变时多久探一次。⚠️ 下限 0.5s —— 命中那一拍还要
                       # 真读 380ms，设到 0.3s 就是"拍比拍还长"，只会丢屏
  probe_thumb: 48      # 缩略图边长；越小越便宜、越小越不敏感

  # ⚠️ **每拍都真读**（不走探针）时才需要它，默认关：
  #    一次读屏 ≈ 380ms，快速档（0.2s）在这条路上根本跑不动，
  #    1s 一拍也要常驻 38% 一个核。打开 = 用 CPU 换「翻过去的那几屏」。
  #    **探针已经用 3.4% 换到同样的东西了**，所以除非探针在你机器上不灵，别开。
  record: false
  # ⚠️ 2026-10-13 **删掉 `record_interval`**：产品代码里没有消费者 ——
  #    上面那个 record=true 之后走的是 `record.interval`（见文件末尾附近），
  #    所以这个数填多少都不生效。别再把它加回来（要改就改 `record.interval`）。

  # 把 [图片] 的**图片本体**裁出来，一并发给模型看。
  # ⚠️ 它属于**读取**（读什么）而不是生成（怎么调模型），
  #    所以放在这一组。
  # 打开后：一屏里认出几个 [图片] 就裁几张（一张一条，按消息顺序）。
  # 关着时：一行都不走 —— 不裁剪、不压缩、不编码，零开销。
  # ⚠️ 为什么**只裁 [图片]**、不发整屏：付款记录那类白底长截图和
  #    聊天底色只差 5~16 个色阶，像素判据**认不出它**；
  #    但它的字已经被 OCR 读进上下文了，不必重复发。
  #    而**认不出字**的图（表情包 / 照片）会产出 [图片]，
  #    那才是真正需要模型看图的。见 ocr_reader._crop_images。
  # ⚠️ 图片**不落库**（只用于当次生成），否则两个库会迅速膨胀。
  attach_image: false

runtime:
  # watch   = 主动轮询，发现新消息就提醒（原有行为）
  # trigger = 不轮询，等用户触发（热键 / 切会话 / 切窗口）
  #
  # 为什么默认用 trigger：轮询本身几乎不耗资源（14.5ms/次，CPU<0.2%），
  # 真正花钱的是它下游的 AI 调用。所以不该让程序擅自替你决定何时调 AI。
  mode: trigger
  poll_interval: 1.0    # 仅 watch 模式有效
  uia_timeout: 20.0     # 单次 UIA 调用超时（秒），超时视为微信无响应
  # 喂给 AI 的上下文最多取最近多少**条消息**（不是对话轮数）。
  # 实测每条中文短消息约 8 token，而固定开销（人设+规则+口吻样本）约 550 token，
  # 所以从 10 条加到 30 条，单次总 token 只涨约 27%（¥0.0003 左右）。
  # 嫌贵就调小，想让它更懂上下文就调大。
  max_messages: 20
  # ⚠️ **只限条数是防不住"长内容"的。**
  # 实测踩过：把提示词全文粘进微信（2000+ 字），那**一条**就把 user 从 57 字
  # 撑到 2071 字，每次调用贵 3 倍（¥0.0010 → ¥0.0024），而 max_messages
  # 对此完全无感 —— 它还是"20 条以内"。
  # 所以再加两道**长度闸**：
  max_msg_chars: 500       # 单条超过就截断（一条粘贴不该把整段上下文挤掉）
  max_chars: 4000          # 渲染后总量超过就从**最旧**的开始丢；填 0 不限制

# ── 悬浮窗外观 ─────────────────────────────────────────────────────────
#
# 这一段的取值都能在设置界面里改（见 wechat_assistant/settings.py 的 SPEC），
# 设置界面改过之后会**覆盖**这里的值，写进 state/settings.json。
#
# ⚠️ 注意 frame/round 的组合：
#   frameless: true  -> 无系统标题栏，自己画标题栏（像微信那样）
#   frameless: false -> 用系统标题栏，拖拽/最小化交给 Windows
ui:
  # auto = 跟着**微信当前渲染出来的颜色**走（采样微信窗口的像素判断），
  #        采样不到（微信最小化）时退回系统设置。
  # 也可以钉死成 dark / light。
  theme: auto
  frameless: true          # 无边框窗口（自绘标题栏）
  # ⚠️ 2026-10-13 **删掉 `rounded`**：产品代码里没有任何地方读它（假开关）。
  #    圆角由下面的 `radius` 决定：0 = 不要圆角。设置界面里也只剩半径那一项。
  radius: 10               # 圆角半径（基准像素，按 DPI 缩放）
  # 跟微信窗口的关系：
  #   dock  = 贴边跟随：站在微信旁边，位置是**算出来的**。
  #           这样"贴得紧"，微信一动就重新贴回去（所以你手动拖过之后会被拉回边上）。
  #   float = 固定悬浮：位置是**你定的** —— 记下你放的那个相对位置，
  #           以后微信怎么动，面板就按同一个偏移跟着一起平移，不会被拉回边上。
  #           高度仍然是面板自己的（按内容自适应），要跟微信一样高就用 dock。
  #   off   = 不跟随：位置、高度都归界面自己。
  attach: dock
  dock_side: auto          # auto（右→左→角落）/ right / left
  follow_minimize: true    # 微信最小化时，面板跟着一起收起来
  # 跟随的检查间隔（秒）。**只读**窗口位置，开销可忽略。
  # ⚠️ 0.4 秒一次会明显"卡顿"（实测反馈过）：拖微信时面板是一跳一跳追上去的。
  #    0.016 = 60 次/秒，跟手；每拍只做几次只读调用，只有真变了才动窗口。
  follow_interval: 0.016
  # ⚠️ 2026-10-13：这一项**不再出现在设置界面**（用户提的「面板宽度不用在设置里调」）——
  #    直接在面板上拖**左/右边缘**就行，松手会自动写回这里（状态栏会提示"已记住"）。
  #    这里留着的是**出厂默认宽度**，也是你点「恢复默认」时回到的值。
  width: 340               # 面板宽度（基准像素）
  # 空间不够时允许把面板缩到多窄。低于这个宽度就不跟随了（宁可不动也别挤成一条）。
  #
  # 为什么需要它：实测过一台机器上微信宽 1593px、屏宽 2240px，两侧各剩
  # 289 / 358px，而面板要 510px —— 于是"完全不跟随"。现在改成先缩窄再站过去，
  # 缩不到 min_width 才放弃。
  min_width: 200
  width_max: 640           # 拖左右边缘调宽度时的上限
  # 面板高度。**0 = 跟随微信窗口的高度**（attach=dock 时），
  # 微信没开或 attach 不是 dock 时才退回"按回复内容自适应"。
  # 填正数 = 钉死这个高度。
  #
  # ⚠️ 高度之所以跟随微信而不是按内容伸缩：内容多的时候窗口一直变高变矮，
  #    看起来在抖；而且面板本来就要站在微信旁边，跟它一样高最自然。
  #    内容超出时**只有回复区滚动**（滚轮），滚动条平时隐藏。
  height: 0
  opacity: 1.0             # 不透明度 0.5~1.0
  # ⚠️ 默认**关**。开着会盖住微信，跟"贴边跟随"的用意相反。
  # （如果担心窗口沉到别的窗口后面找不回来：热键会自动把它唤醒到最前。）
  topmost: false

# 触发策略：什么时候读取会话（以及是否顺便生成建议）
#
# 默认**只开热键**。原因（用户实测反馈）：
#   开着「切窗口触发」时，用户点完【复制】切回微信去粘贴，
#   这个动作本身又触发了一次读取+生成，悬浮窗内容被替换 —— 很烦，而且白烧 token。
#   切窗口/切会话都是「无意图」动作，不该等同于「我要建议」。
# 需要时再打开下面两项；打开后也只做轻量读取，不自动调 AI。
#
# 技术可行性均已实测（probes/test_triggers.py）：
#   全局热键 RegisterHotKey      可用（这是「接收」按键，不模拟，符合红线）
#   窗口事件 SetWinEventHook     可用（监听 EVENT_SYSTEM_FOREGROUND，零轮询）
#   切换会话检测                 可用（轻量读标题，约 12~70ms/次）
trigger:
  enabled: true
  on_hotkey: "Ctrl+Alt+Q"      # 全局热键，程序不在前台也能响应；留空 "" 关闭
  on_window_focus: false       # 微信窗口被切到前台时（默认关，见上方说明）
  on_session_switch: false     # 切换到别的会话时（默认关，见上方说明）
  session_poll_interval: 1.5   # 上面那项的检测间隔（秒）
  min_interval: 3.0            # 防抖：两次触发至少间隔这么久（秒）
  auto_generate: true          # 触发了就生成（触发的都是明确意图，如热键/按钮）
  # 复制后的「冷静期」：这段时间内忽略自动触发源（切窗口/切会话），
  # 因为用户正在去微信粘贴的路上，程序不该插嘴。热键/按钮不受此限制。
  cooldown_after_copy: 20.0

# OCR（仅用于群聊昵称、图片内文字）
#
# ⚠️ 下面这几个值不要随手改，它们是实测出来的最优解：
#    默认配置下一张 978x84 的消息行图要 9.19 秒，且会把 20 个核心全部拉满
#    （任务管理器 CPU 100%、整机卡顿）。
#    intra_op_num_threads: onnxruntime 默认 0=自动，实测在本机是灾难
#                          （rec 模型：自动 233ms vs 显式设线程 12ms）
#    limit_type: 默认 min 表示「保证短边 >= 736」，会把极扁的消息行图
#                放大成 736x2944（面积 26 倍）。改成 max 后按长边限制。
#    limit_side_len: 不要为了更快调到 320 —— 实测识别质量会崩
#                    （'测试'→空、'行'→空、昵称丢失，仅 2/12 张正确）。
#    优化后：0.13 秒/张，识别结果与默认配置逐张一致。
ocr:
  intra_op_num_threads: 4
  inter_op_num_threads: 1
  limit_side_len: 736
  limit_type: max
  use_cls: false        # 聊天截图不会倒置，方向分类纯属浪费
  warmup: true          # 启动时预热一次，避免首次识别卡顿

# 发送者判定（这条消息是谁发的）
#
# 微信 4.x 的 UIA 不提供发送者信息（消息项 rect 是整行、属性全空、不支持 TextPattern），
# 所以只能靠**像素**分析：
#   单聊：看气泡靠左(对方)/靠右(自己) —— 主力判据，实测区分度 0.94~1.00 vs 0.00
#   群聊：同样用像素判左右；「具体是谁」另用行高筛 + OCR 读左上角昵称
#
# 取图方式由下面的 capture_mode 决定。**默认 PrintWindow，不需要窗口可见**
# （被别的窗口遮挡、不在前台都照样能判）。只有窗口最小化时会放弃判定，
# 把该条标成「?」(未判定)，不瞎猜。
sender:
  enabled: true
  capture_mode: printwindow      # 取图方式，决定「发送者判定」稳不稳：
                                 #   printwindow（默认）—— 让微信窗口自己把内容画成位图，
                                 #     不受遮挡影响，也不用把微信置顶打扰你。
                                 #     实测：非前台且被浏览器+悬浮窗遮挡时仍命中全部消息。
                                 #   screen —— 旧行为，屏幕截图。**被遮挡就截到别人的窗口**
                                 #     （实测 OCR 出来是别的程序界面），只有窗口可见时才可靠。
  auto_topmost: false            # 仅 screen 模式有效：被遮挡时是否临时置顶截图（会打扰，默认关）
  read_nickname: true            # 群聊是否 OCR 读昵称（关掉则只分「自己/别人」）
  nickname_min_hits: 2           # ⚠️ 同一个名字在同一会话里读到几次才认。
                                 # 为什么要有这道：图片里的字会被误读成昵称，
                                 # 而它们**每个只出现一次**；真昵称跟着人的每条消息复现。
                                 # 调到 1 = 关掉这道闸（退回旧行为，不推荐）。
                                 # 只存在内存、不落盘 -> 重启后每个人第一条消息没有名字。
  nickname_min_row_height: 100   # 行高 >= 它才可能带昵称行；**只用来决定要不要 OCR**，
                                 # 不能用来判断是不是自己发的（单聊里谁都可能是 84）
  max_ocr_rows: 8                # 单次最多 OCR 多少行，防止极端情况耗时过长

sessions:
  # 默认模式：
  #   "on"  = 所有会话都能用（记录上下文 + 生成建议）—— 当前设置
  #   "off" = 白名单模式（新会话默认不处理，要手工加进 bootstrap_whitelist）
  #
  # ⚠️ 一定要带引号！YAML 会把**裸写的** on / off / yes / no 当成布尔值，
  #    写 `default_mode: on` 读出来是 True，不等于 "on" —— 结果是所有会话
  #    都不启用，而且不报错。代码里也做了归一化兜底，但还是带引号最稳。
  #
  # 2026-09-23 起改成 on：用户要求「所有会话都可以」。
  default_mode: "on"

  # ⚠️ 改成 on 之后，**你打开的每个会话都会被记录**（原本「未启用就完全不读不记」
  #    的那条隐私承诺就没有了）。如果有不想被处理的会话，写进下面的黑名单。
  disabled: []
    # 黑名单里的会话：**完全不读、不记录、不生成**，优先级高于白名单。
    # 示例：
    # - "某某银行"
    # - "XX 工作群"

  # ⭐ **系统会话**（关键词，**子串**匹配）—— 这些不是聊天，但微信里长得一样，
  #    有标题栏、有内容区，所以像素这条路照样会把它们读成会话、把内容读成消息。
  #    命中这里的会话一律不读不记（优先级和黑名单一样高）。
  #
  # ⚠️ 用子串是因为公众号有成千上万个（人民日报 / 新华社 / …），全等没法穷举。
  # ⚠️ 副作用：名字里**碰巧**含这些词的真会话也会被排除（比如一个叫
  #    「XX公众号运营交流群」的群）。**误伤了就直接把那一行删掉**，
  #    或者改用上面的 `disabled`（全等）精确排除。
  disabled_contains:
    - "公众号"      # 公众号聚合页；名字带「公众号」的也一并挡掉
    - "微信支付"    # 收付款通知，不是聊天
    - "服务通知"    # 各种系统通知（含「微信支付」的替代入口）
    - "订阅号"      # 订阅号消息
    - "微信团队"    # 登录/安全提醒
    - "微信运动"    # 步数
    - "企业微信"    # 企业微信通知
    - "文件传输助手"  # 自己给自己传文件，不是对话
    # ⚠️ 2026-10-13 加：**游戏中心面板**不是会话。实测它那 8 条卡片文案
    #    （'每日游戏速递' / '火柴人枪战对决正版 躲掩体后狙击…'）全被判成
    #    **「我」发的**（`is_self=1`）—— 直接进历史，AI 会以为你聊过这些。
    - "微信游戏"

  # 白名单：只在 default_mode 为 off 时才有意义。
  # 现在 default_mode 是 on，这里留空即可。
  bootstrap_whitelist: []

  # ⭐ **只差 emoji/符号的会话名当成同一个会话**（默认开，建议别关）
  #
  # 为什么需要：`session_key` 就是会话标题原文，而两个后端读同一个标题
  # **会给出不同的字符串**：
  #     真值 '♥️示例群名🏠'
  #       UIA -> '♥️示例群名🏠'（读控件的 Name，emoji 原样）
  #       OCR -> '口口示例群名口'（认字形，emoji 认不出）
  # 实测（probes/probe_title_variants.py）：6 个真实会话名里 **3 个**不一致。
  # 不合并的话**换一次后端就把同一个会话的历史劈成两半**，
  # 关系设定 / 人设 / 知识库 / 黑名单也各认各的。
  #
  # 归一化**只去掉装饰**（emoji / 符号 / 零宽 / 空白），文字和数字全保留。
  # ⚠️ 全 emoji 的名字归一化后是空串 —— 那种**不参与合并**（否则会互相挤成一条）。
  # ⚠️ 代价：两个只差 emoji 的**不同**会话（比如「兄弟群🎉」和「兄弟群😭」）
  #    会被当成同一个。这种概率很低，而"劈成两半"是每次换后端都发生。
  merge_variants: true

state:
  path: "state/state.json"   # 运行状态（会话表、已处理游标）的存储位置

logging:
  # ⚠️ 2026-10-13 **删掉 `level`**：没有任何地方读它（日志走 print + 打包版重定向），
  #    设置界面里那个「日志级别」选择框也因此删了 —— 选它不会有任何效果。
  show_ignored_sessions: true   # 是否打印被白名单忽略的会话
                                # ⚠️ 只有没接线的 `watcher.py` 读它（那里是死代码），
                                #    所以现在这个开关也不生效。留着是为了接回 Watcher 时不用再想。

# ── 历史库（累积上下文）────────────────────────────────────────────────
#
# UIA 一屏只能看到 5~6 条消息，每次读完就丢。把每次读到的都存进本地 SQLite，
# 累积起来就比任何单次可见的都多 —— 吵架场景尤其需要（要看到矛盾怎么起来的）。
#
# ⚠️ 存储本身不花任何 AI token；只有"喂给 AI 的条数"才花钱，
#    那个由 runtime.max_messages 控制。
# ⚠️ 它不突破微信的限制：读不到的东西存不下来，只是把每次读到的攒起来。
history:
  enabled: true
  path: "state/history.db"
  max_per_session: 500      # 每个会话最多保留多少条，超出的自动删
  screens_path: "state/screens.db"   # 屏快照库（新，见下面 record.backend）

# ── 静默记录（把对话记全）──────────────────────────────────────────────
#
# 为什么需要它：在此之前历史库只在「你按热键」的那一刻存一次快照，
#   两次触发之间聊的内容会丢，顺序也变成「按你按热键的顺序」。
#   打开它之后，每几秒读一次当前会话并写库。
#
# ⚠️ 它**只写库**：不调 AI（token 消耗为 0）、不弹窗、不提醒、不碰微信状态。
#    要不要问 AI 完全由你决定（热键 / 悬浮窗按钮）。
#
# 成本：UIA 全量读取约 50~90ms；有变化时再加发送者判定约 45ms。
#       2 秒一次 ≈ 占 7% 时间片，CPU < 0.2%。没变化时跳过判定，开销更低。
#
# 只记录白名单里 mode 为 on / observe 的会话；off 的会话**完全不读不记**。
# （observe = 只记录不生成，借这个开关终于有了实际用途）
record:
  enabled: true
  interval: 1.0          # 空闲时几秒读一次；别低于 0.5（UIA 读一次就要 50ms+）
  # ── 自适应采样 ────────────────────────────────────────────────────────
  # 内容在变（你在翻聊天记录 / 来了新消息）时自动加快，安静下来再回落。
  # 为什么需要：固定 1 秒一拍，而人快速滑动时一秒能滑过好几屏 ——
  # 中间那些屏根本没被采到（加上虚拟列表，滚太快时它们也没渲染出来）。
  #
  # 实测一拍的开销：读一屏 50~90ms + 发送者判定 ~45ms ≈ 110ms，
  # 所以 0.2s 间隔下占空约 55%。但**只在内容真变了的那几秒**才进这个档，
  # 安静时立刻回落，平均开销和原来差不多。
  # 填 0 = 关掉自适应，永远用上面的 interval。
  fast_interval: 0.2     # 内容在变时的间隔（秒）；下限自动钳到 0.05
  fast_hold: 3.0         # 变过一次之后保持快速档多久（秒），之后回落
  report_every: 30       # 每多少次打一行统计，避免刷屏（0 = 不打）
  # 上下文的顺序由谁来给：
  #   "screens"  = 屏快照 + 缝合（新，默认）。一屏一条**无条件**存下来，
  #                读取时从最新一屏往前缝（内容重叠就接上，接不上就停）。
  #                用户**往上翻历史**看到的内容也会被记下来 —— 旧路径在那种
  #                情况下（重叠点找不到 + 不在底部）整屏都不写。
  #   "messages" = 旧的消息表（save_new_only + 重叠点 + 底部兜底）。
  # 两套并行写（存储不花 token）；出问题改这一行就能退回旧路径。
  backend: "screens"
  keep_screens: 40       # 每个会话保留最近多少屏（40 屏 ≈ 300 条消息）

# ── 回复目标怎么选 ─────────────────────────────────────────────────────
#
# 鼠标停在某条消息上按热键 -> 以那条为锚点，往上合并「连续的同一个人说的消息」
#   当成一个「回复目标块」。真实聊天里要回的往往是一段而不是一句。
# 鼠标不在消息上           -> 用可见的最后一条（此时才要求列表滚到了底部）
reply:
  # ⚠️ 默认 **false**：**不再用鼠标锚点**，直接把当前屏幕上的全部对话当成回复目标。
  #    为什么改：① 用锚点要求"先把鼠标移到那句话上再按热键"，多一个动作；
  #              ② 鼠标位置**完全不可靠** —— 实测抓到过我们自己的「看提示词」
  #                 窗口里的文字，把提示词全文当成了对方的消息，一次贵 3 倍。
  #    想找回旧行为就打开它。
  use_cursor_anchor: false
  target_max_block: 8       # 目标块最多合并几条
  history_messages: 40      # 从历史库最多取多少条作为候选上下文
  # 用微信自己的时间分隔符切段（`mmui::ChatItemView`，Name 形如 "16:19" /
  # "昨天 23:28"）。分隔符是聊天里天然的分段线：
  #   跨天的（昨天 / 星期X / 9月20日）-> 取最后一个，把它**前面**的内容切掉。
  #       隔着日期的内容几乎必然是旧话题，留在 prompt 里只是噪音（时效性优先）。
  #   纯时间（16:19）-> 不切，它只是同一天内的锚点。
  # 关掉就退回"缝到哪算哪"。
  cut_at_date: true

# ── AI 接口 ────────────────────────────────────────────────────────────
# ⚠️ 这里**没有** api_key —— 密钥不属于出厂配置，不随程序分发。
#    要填就写同目录的 secrets.yaml（已加入 .gitignore，不会被提交），
#    或者在程序的「设置 → AI 接口」里填（它也是写进 secrets.yaml）。
#
#    没有密钥时程序照常启动、照常记录会话，只是生成建议会报「未配置 api_key」。
ai:
  # ⚠️ 接口地址与模型**出厂是空的**（2026-10-13 用户要求「默认为空」）：
  #    它们和 Key 一样属于"你用的哪家服务商"，各家不一样，替他预填
  #    （原来写的是 DeepSeek）会让人以为自己填过、或者报错时看不出是地址的问题。
  #    留空 = 没配置 -> 程序会说「还没配置：接口地址、模型名」，去设置里填。
  #    例子（DeepSeek）：接口地址 https://api.deepseek.com，模型 deepseek-chat。
  #    ⚠️ 只填 Key 是**不够的**：三样齐全才会真的发请求。
  base_url: ""
  model: ""
  n_replies: 3                 # 生成几条备选回复
  temperature: 1.0
  # ⚠️ 这个上限**把「思考」也算在内**（推理模型先想再答）。
  #    2026-10-13 用户实测：原来的 800 被思考吃光，
  #    **正文输出 0 字**、建议生成不出来
  #    （而「看提示词」里能看到长长一段 —— 那是思考）。
  #    ⚠️ 它**不是预扣费**：只按实际输出计费，调大没有代价。
  max_tokens: 2000
  timeout: 60

  # 只用于日志里估算花费（单位：元 / 百万 token）。
  # ⚠️ 2026-10-13：这两项**不再出现在设置界面**（用户提的「输入输出价格不用设置」）——
  #    它们只管日志里那个"（约 ¥x.xxxx）"，改成默认价、平时不用管。
  #    价格随时会变，以官网为准；**填 0 = 日志里只打印 token 数、不打印金额**
  #    （想知道真实花费自己去官网对一下，或把这里改成你那个模型的价）。
  # 实测参考：输入 ≈ ¥1/百万，输出 ≈ ¥4/百万（输出贵 4 倍，是成本大头）。
  price_in: 1.0
  price_out: 4.0

# ── 人设 ───────────────────────────────────────────────────────────────
#
# 反 AI 腔的硬性规则写在代码里（ai.py 的 ANTI_TEMPLATE_RULES），不用在这里重复。
# 这里只放「你是谁、跟谁说话」这类信息。
persona:
  default: |
    你帮「我」写微信回复。
    写的是「我」要说的话，用第一人称，直接能发出去。
    对方发短消息时你也回短的。
  per_session: {}
    # 按 session_key 覆盖全局人设，示例：
    # "张三_work": |
    #   帮「我」给同事回话，不闲聊。

  # 关系：影响称呼、语气和分寸。可按会话单独覆盖。
  default_relationship: "朋友"
  relationships: {}
    # 示例：
    # "张三_work": "同事，就事论事，不用表情和网络用语"
    # "张三": "关系很好的朋友，可以随便开玩笑"
    # "🈲示例23班乙群🈲": "同学群，随大流就好，不用太正经"

# 口吻样本：把「我」最近发过的短消息喂给模型，让它照着模仿。
# 比任何形容词都准 —— 「语气自然、简短」模型只能猜，给它几句真话它就会学。
style:
  enabled: true
  max_samples: 12        # 最多取几条当样本
  max_length: 60         # 超过这个字数的消息不算口吻样本（长段落不代表日常说话）
